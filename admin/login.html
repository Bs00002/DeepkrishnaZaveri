<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | DEEPKRISHNA ZAVERI</title>
  
  <link rel="icon" type="image/png" href="../assets/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/line-awesome.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <img src="../assets/brand/logo_badge_square.png" alt="DEEPKRISHNA ZAVERI" class="login-logo">
    <h1 class="login-title">DEEPKRISHNA ZAVERI</h1>
    <p class="login-subtitle">Administrative Management Portal</p>

    <div id="login-error-alert" style="display: none; background: #FFEBEE; color: #C62828; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.82rem; margin-bottom: 20px; border: 1px solid #EF9A9A; text-align: left;">
      <i class="las la-exclamation-circle"></i> <span id="login-error-text">Invalid credentials.</span>
    </div>

    <form id="admin-login-form">
      <div class="form-group" style="text-align: left;">
        <label for="username" class="form-label">Admin Username</label>
        <div style="position: relative;">
          <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="username" style="padding-left: 36px;">
          <i class="las la-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-taupe); font-size: 1.1rem;"></i>
        </div>
      </div>

      <div class="form-group" style="text-align: left; margin-bottom: 24px;">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password" style="padding-left: 36px;">
          <i class="las la-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-taupe); font-size: 1.1rem;"></i>
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="btn-admin btn-gold-admin" style="width: 100%; justify-content: center; padding: 12px;">
        <span>Authenticate & Enter</span>
        <i class="las la-arrow-right"></i>
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--color-cream-border); font-size: 0.76rem; color: var(--color-taupe);">
      A Legacy Since 1952 • Deepkrishna Zaveri Showroom 2026<br>
      <a href="../index.html" style="color: var(--color-brown-primary); text-decoration: none; font-weight: 600; display: inline-block; margin-top: 8px;">
        &larr; Return to Public Website
      </a>
    </div>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already authenticated, redirect to dashboard
      if (AdminAuth.isAuthenticated()) {
        window.location.href = 'index.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      const errorAlert = document.getElementById('login-error-alert');
      const errorText = document.getElementById('login-error-text');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="las la-spinner la-spin"></i> Verifying...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const res = await AdminAuth.login(username, password);
          if (res.success) {
            // Check url redirect param
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'index.html';
            window.location.href = redirect;
          } else {
            errorText.textContent = res.error || 'Invalid credentials. Please try again.';
            errorAlert.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Authenticate & Enter</span> <i class="las la-arrow-right"></i>';
          }
        } catch (err) {
          errorText.textContent = 'Network or server error. Please try again.';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Authenticate & Enter</span> <i class="las la-arrow-right"></i>';
        }
      });
    });
  </script>
</body>
</html>
